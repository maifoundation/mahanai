<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codex Connected</title>

<link rel="icon" type="image/png" href="./icons/icon.png">

<style>
:root {
    --bg: #f6f7fb;
    --text: #111827;
    --muted: #6b7280;
    --accent: #2563eb;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Inter, system-ui, sans-serif;
    background: var(--bg);
}

.container {
    text-align: center;
    max-width: 420px;
    padding: 32px;
}

.logo {
    width: 100px;
    height: 100px;
    object-fit: contain;
}

.icon-and-badge {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
}

.badge {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(37, 99, 235, 0.08);
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
}

h1 {
    margin: 0;
    font-size: 32px;
    font-weight: 700;
    color: var(--text);
}

p {
    margin-top: 14px;
    color: var(--muted);
    line-height: 1.6;
    font-size: 15px;
}
</style>
</head>
<body>

<div class="container">

    <div class="icon-and-badge">
        <img src="./icons/icon.png" alt="MahanAI" class="logo">
        <div class="badge">Connected</div>
    </div>

    <h1>Codex Connected</h1>

    <p>
        Your Codex account has been linked successfully.
        You may now return to MahanAI.
    </p>

</div>

</body>
</html>
